<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schedule and marking — Doyle hearing prep</title>
<style>
  :root{
    --ground:#E8EBE4; --panel:#FCFCFA; --ink:#17201C; --muted:#5C6862;
    --accent:#6B2D2D; --rule:#CFD6C9; --done:#4A6B52; --work:#8A6A1F;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--ground); color:var(--ink);
    font:400 16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:28px 20px 80px}
  .wrap{max-width:840px; margin:0 auto}
  h1{font:600 19px/1.2 system-ui,sans-serif; margin:0 0 4px}
  .sub{color:var(--muted); font-size:13.5px; margin:0 0 6px}
  .tally{color:var(--muted); font-size:13.5px; margin:14px 0 24px}
  .weekhead{font:600 14px system-ui,sans-serif; color:var(--accent);
    margin:30px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--rule)}
  details{background:var(--panel); border:1px solid var(--rule); border-left-width:3px;
    border-radius:3px; margin-bottom:8px; padding:0}
  details[data-s="done"]{border-left-color:var(--done)}
  details[data-s="work"]{border-left-color:var(--work)}
  summary{cursor:pointer; padding:13px 16px; list-style:none; display:flex; gap:12px; align-items:baseline}
  summary::-webkit-details-marker{display:none}
  summary:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
  .dnum{color:var(--muted); font-size:13px; min-width:78px; flex:none}
  .dq{font:400 16px/1.45 Charter,"Bitstream Charter",Georgia,serif}
  .body{padding:0 16px 16px 106px}
  .body ul{margin:0 0 14px; padding-left:20px}
  .body li{margin-bottom:6px; font-size:15px}
  .focus{color:var(--muted); font-size:14px; margin:0 0 14px}
  .marks{display:flex; gap:8px; flex-wrap:wrap}
  .marks button{font:500 14px system-ui,sans-serif; padding:7px 13px; border-radius:3px;
    border:1px solid var(--rule); background:#fff; color:var(--ink); cursor:pointer}
  .marks button[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}
  .foot{margin-top:34px; font-size:13px; color:var(--muted)}
  .foot a{color:var(--accent)}
  @media (max-width:560px){
    .body{padding-left:16px}
    summary{flex-direction:column; gap:4px}
  }
  @media print{ body{background:#fff} details{break-inside:avoid} .marks{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <h1>Schedule and marking</h1>
  <p class="sub">Tanager and Pepper v Doyle, 2020/45CA. All 42 days, with the points each answer should hit.</p>
  <p class="tally" id="tally"></p>
  <div id="list"></div>
  <p class="foot">Kieran's answers arrive by email, not through this page. Marking here is stored on this device only, as your own record of where he is. His page is at <a href="index.html">index.html</a>.</p>
</div>

<script src="questions.js"></script>
<script>
(function(){
  const key = d => "kd:mark:" + d;
  const getMark = d => { try { return localStorage.getItem(key(d)) || ""; } catch(e){ return ""; } };
  const setMark = (d,v) => { try { v ? localStorage.setItem(key(d),v) : localStorage.removeItem(key(d)); } catch(e){} };
  const dayMs = 86400000;
  const dateFor = d => new Date(new Date(START_DATE+"T00:00:00").getTime()+(d-1)*dayMs)
    .toLocaleDateString("en-IE",{day:"numeric", month:"short"});

  function tally(){
    let done=0, work=0;
    QUESTIONS.forEach(x => { const m=getMark(x.d); if(m==="done")done++; if(m==="work")work++; });
    document.getElementById("tally").textContent =
      done + " strong, " + work + " needing work, " + (42-done-work) + " not yet marked.";
  }

  const list = document.getElementById("list");
  let lastWeek = 0;

  QUESTIONS.forEach(item => {
    if(item.week !== lastWeek){
      lastWeek = item.week;
      const h = document.createElement("p");
      h.className = "weekhead";
      h.textContent = "Week " + item.week + ". " + WEEKS[item.week];
      list.appendChild(h);
    }

    const d = document.createElement("details");
    d.dataset.s = getMark(item.d);

    const s = document.createElement("summary");
    const n = document.createElement("span");
    n.className = "dnum"; n.textContent = "Day " + item.d + ", " + dateFor(item.d);
    const q = document.createElement("span");
    q.className = "dq"; q.textContent = item.q;
    s.append(n, q); d.appendChild(s);

    const b = document.createElement("div"); b.className = "body";
    const f = document.createElement("p"); f.className = "focus"; f.textContent = item.focus;
    const ul = document.createElement("ul");
    item.covers.forEach(c => { const li=document.createElement("li"); li.textContent=c; ul.appendChild(li); });
    const marks = document.createElement("div"); marks.className = "marks";

    [["done","Strong"],["work","Needs work"]].forEach(([val,label]) => {
      const btn = document.createElement("button");
      btn.textContent = label;
      btn.setAttribute("aria-pressed", getMark(item.d) === val);
      btn.onclick = () => {
        const cur = getMark(item.d);
        const next = cur === val ? "" : val;
        setMark(item.d, next);
        d.dataset.s = next;
        marks.querySelectorAll("button").forEach((x,i) =>
          x.setAttribute("aria-pressed", next === ["done","work"][i]));
        tally();
      };
      marks.appendChild(btn);
    });

    b.append(f, ul, marks); d.appendChild(b);
    list.appendChild(d);
  });

  tally();
})();
</script>
</body>
</html>
