<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paul — Kieran Progress Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f4f0;min-height:100vh;padding:16px}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
h1{font-size:20px;font-weight:600;color:#1a1a1a}
.sub{font-size:13px;color:#888;margin-top:3px;margin-bottom:16px}
.stat-row{display:flex;gap:12px;margin-bottom:16px}
.stat{flex:1;background:#f9f9f7;border-radius:12px;padding:14px;text-align:center}
.stat-num{font-size:28px;font-weight:700;color:#1a56db}
.stat-label{font-size:11px;color:#888;margin-top:2px;text-transform:uppercase;letter-spacing:.05em}
.progress-wrap{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px}
.pip{width:10px;height:10px;border-radius:50%;background:#e0e0e0}
.pip.done-strong{background:#22c55e}
.pip.done-weak{background:#f59e0b}
.pip.active{background:#1a56db}
.result-item{border:1px solid #f0f0ec;border-radius:12px;padding:14px;margin-bottom:10px}
.result-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.result-day{font-size:13px;font-weight:600;color:#1a1a1a}
.result-time{font-size:11px;color:#aaa}
.result-badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px}
.strong{background:#dcfce7;color:#166534}
.weak{background:#fef9c3;color:#854d0e}
.result-q{font-size:13px;color:#666;margin-bottom:6px;font-style:italic}
.result-a{font-size:13px;color:#333;margin-bottom:6px;line-height:1.5}
.result-assessment{font-size:13px;color:#444;background:#f9f9f7;padding:10px;border-radius:8px;line-height:1.5}
.empty{text-align:center;padding:40px 20px;color:#aaa;font-size:14px}
.refresh-btn{display:block;width:100%;padding:12px;background:#f0f0ec;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;color:#444;margin-bottom:12px}
.refresh-btn:hover{background:#e4e4e0}
.kieran-link{text-align:center;margin-top:8px}
.kieran-link a{font-size:13px;color:#1a56db;text-decoration:none}
.section-title{font-size:13px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.no-results{color:#aaa;font-size:14px;text-align:center;padding:20px}
details{margin-bottom:10px}
summary{font-size:14px;font-weight:500;color:#1a1a1a;cursor:pointer;padding:10px 14px;background:#f9f9f7;border-radius:10px;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
.summary-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px}
details[open] summary{border-radius:10px 10px 0 0;background:#f0f0ec}
.detail-body{padding:12px 14px;background:#f9f9f7;border-radius:0 0 10px 10px;border-top:1px solid #e8e8e4}
</style>
</head>
<body>

<div class="card">
  <h1>📊 Paul — Kieran's Progress</h1>
  <p class="sub">Tanager v Doyle 2020/45CA · Hearing: 13 October 2026</p>
  <div class="stat-row">
    <div class="stat"><div class="stat-num" id="days-done">0</div><div class="stat-label">Days done</div></div>
    <div class="stat"><div class="stat-num" id="strong-count">0</div><div class="stat-label">Strong ✅</div></div>
    <div class="stat"><div class="stat-num" id="weak-count">0</div><div class="stat-label">Needs work ⚠️</div></div>
  </div>
  <div class="progress-wrap" id="progress"></div>
  <div class="kieran-link"><a href="index.html">← Kieran's quiz</a></div>
</div>

<button class="refresh-btn" onclick="load()">↻ Refresh results</button>

<div class="card">
  <div class="section-title" id="results-title">Recent results</div>
  <div id="results-list"></div>
</div>

<script>
const PAUL_KEY='paul_results';
const SCHEDULE_DAYS=42;

function getResults(){
  try{return JSON.parse(localStorage.getItem(PAUL_KEY))||[];}catch(e){return[];}
}

function getState(){
  try{return JSON.parse(localStorage.getItem('kieran_v2'))||{day:1,results:[]};}catch(e){return{day:1};}
}

function fmt(iso){
  try{
    const d=new Date(iso);
    return d.toLocaleDateString('en-IE',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-IE',{hour:'2-digit',minute:'2-digit'});
  }catch(e){return '';}
}

function load(){
  const results=getResults();
  const state=getState();
  const currentDay=state.day||1;

  document.getElementById('days-done').textContent=results.length;
  document.getElementById('strong-count').textContent=results.filter(r=>r.strong).length;
  document.getElementById('weak-count').textContent=results.filter(r=>!r.strong).length;

  const prog=document.getElementById('progress');
  prog.innerHTML='';
  for(let i=1;i<=SCHEDULE_DAYS;i++){
    const pip=document.createElement('div');
    pip.className='pip';
    const res=results.find(r=>r.day===i);
    if(res){pip.classList.add(res.strong?'done-strong':'done-weak');}
    else if(i===currentDay){pip.classList.add('active');}
    pip.title=`Day ${i}`;
    prog.appendChild(pip);
  }

  const list=document.getElementById('results-list');
  if(results.length===0){
    list.innerHTML='<div class="no-results">No results yet. Kieran has not submitted any answers.</div>';
    document.getElementById('results-title').textContent='No results yet';
    return;
  }

  document.getElementById('results-title').textContent=`${results.length} answer${results.length!==1?'s':''} submitted`;

  const sorted=[...results].reverse();
  list.innerHTML='';
  sorted.forEach(r=>{
    const el=document.createElement('details');
    el.innerHTML=`
      <summary>
        <span>Day ${r.day} — ${r.week||''}</span>
        <span class="summary-badge ${r.strong?'strong':'weak'}">${r.strong?'STRONG ✅':'NEEDS WORK ⚠️'}</span>
      </summary>
      <div class="detail-body">
        <div class="result-time" style="margin-bottom:8px">${fmt(r.time)}</div>
        <div class="result-q">${r.question}</div>
        <div style="font-size:11px;font-weight:600;color:#888;margin:8px 0 4px">Kieran's answer:</div>
        <div class="result-a">${r.answer}</div>
        <div style="font-size:11px;font-weight:600;color:#888;margin:8px 0 4px">Claude's assessment:</div>
        <div class="result-assessment">${r.assessment}</div>
      </div>`;
    list.appendChild(el);
  });
}

load();
setInterval(load,30000);
</script>
</body>
</html>
