<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearing prep — Kieran Doyle</title>
<style>
  :root{
    --ground:#E8EBE4;
    --panel:#FCFCFA;
    --ink:#17201C;
    --muted:#5C6862;
    --accent:#6B2D2D;
    --rule:#CFD6C9;
    --done:#4A6B52;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font:400 16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:28px 20px 80px;
  }
  .wrap{max-width:720px; margin:0 auto}

  header{margin-bottom:26px}
  h1{font:600 19px/1.2 system-ui,sans-serif; margin:0 0 4px; letter-spacing:-.01em}
  .sub{color:var(--muted); font-size:13.5px; margin:0}

  .track{display:flex; gap:3px; margin:20px 0 8px; align-items:flex-end; height:22px}
  .tick{flex:1; height:9px; background:var(--rule); border-radius:1px; border:0; padding:0; cursor:pointer}
  .tick.done{background:var(--done); height:14px}
  .tick.now{background:var(--accent); height:22px}
  .tick:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
  .count{color:var(--muted); font-size:13px; margin:0 0 26px}

  .card{background:var(--panel); border:1px solid var(--rule); border-radius:3px; padding:26px 24px}
  .theme{color:var(--accent); font-size:13px; margin:0 0 18px; font-weight:600}
  .q{
    font:400 25px/1.38 Charter,"Bitstream Charter","Iowan Old Style",Georgia,serif;
    margin:0 0 18px; max-width:34em; letter-spacing:-.005em;
  }
  .drill{background:var(--accent); color:#fff; font:600 12px system-ui,sans-serif;
    letter-spacing:.06em; padding:7px 12px; border-radius:2px; margin:0 0 16px; display:inline-block}
  .focus{
    border-left:2px solid var(--accent); padding:2px 0 2px 14px; margin:0 0 24px;
    color:var(--muted); font-size:14.5px; max-width:36em;
  }
  textarea{
    width:100%; min-height:190px; padding:14px; border:1px solid var(--rule);
    border-radius:3px; background:#fff; color:var(--ink); resize:vertical;
    font:400 16px/1.6 Charter,Georgia,serif;
  }
  textarea:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent}

  .row{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px}
  button.act{
    font:600 15px system-ui,sans-serif; padding:11px 18px; border-radius:3px;
    border:1px solid var(--accent); cursor:pointer;
  }
  .primary{background:var(--accent); color:#fff}
  .ghost{background:transparent; color:var(--accent)}
  button.act:focus-visible{outline:2px solid var(--ink); outline-offset:2px}

  .check{margin-top:26px; padding-top:22px; border-top:1px solid var(--rule)}
  .check h2{font:600 14px system-ui,sans-serif; margin:0 0 12px}
  .check ul{margin:0; padding-left:20px; max-width:36em}
  .check li{margin-bottom:8px; font-size:15px}
  .hidden{display:none}

  .nav{display:flex; justify-content:space-between; margin-top:22px}
  .nav button{
    background:none; border:0; color:var(--accent); font:500 14.5px system-ui,sans-serif;
    cursor:pointer; padding:6px 2px;
  }
  .nav button[disabled]{color:var(--rule); cursor:default}
  .saved{color:var(--done); font-size:13.5px; margin-top:12px}
  .wc{color:var(--muted); font-size:13px; margin:10px 0 0}
  .mic{width:100%; padding:18px; border-radius:3px; border:1px solid var(--accent);
    background:var(--accent); color:#fff; font:600 17px system-ui,sans-serif; cursor:pointer;
    margin-bottom:12px}
  .mic.live{background:#8C3A3A; border-color:#8C3A3A}
  .mic:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
  .mode{color:var(--muted); font-size:13px; margin:0 0 12px}
  .listen{background:transparent; color:var(--accent); border:1px solid var(--accent);
    border-radius:3px; padding:9px 15px; font:600 15px system-ui,sans-serif;
    cursor:pointer; margin:0 0 20px}
  .listen.live{background:var(--accent); color:#fff}
  .listen:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
  textarea[readonly]{background:#F4F5F1; color:var(--ink)}
  .wc.warn{color:var(--accent)}
  .foot{margin-top:30px; font-size:13px; color:var(--muted)}
  .foot a{color:var(--accent)}
  @media (prefers-reduced-motion:no-preference){
    .check{animation:in .28s ease}
    @keyframes in{from{opacity:0}to{opacity:1}}
  }
  @media (max-width:520px){
    .q{font-size:21px}
    .card{padding:20px 16px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Hearing prep</h1>
    <p class="sub" id="sub"></p>
    <div class="track" id="track"></div>
    <p class="count" id="count"></p>
  </header>

  <div class="card">
    <p class="theme" id="theme"></p>
    <p class="drill hidden" id="drill">DRILL. OUT LOUD, SIXTY SECONDS, NOTHING IN FRONT OF YOU.</p>
    <p class="q" id="q"></p>
    <p class="focus" id="focus"></p>
    <button class="listen" id="listen">Read the question to me</button>

    <button class="mic" id="mic">Press and speak your answer</button>
    <p class="mode" id="mode"></p>
    <textarea id="ans" placeholder="Write your answer here. Full sentences, the way you would say it standing up."></textarea>

    <div class="row">
      <button class="act primary" id="send">Save and send to Paul</button>
      <button class="act ghost" id="copy">Copy for Paul</button>
    </div>
    <p class="saved hidden" id="saved"></p>
    <p class="wc" id="wc"></p>

    <div class="check hidden" id="check">
      <h2>A strong answer covers</h2>
      <ul id="checkList"></ul>
    </div>

    <div class="nav">
      <button id="prev">Previous day</button>
      <button id="next">Next day</button>
    </div>
  </div>

  <p class="foot">Answers are saved on this device only. Sending them to Paul is what puts them on the record, so use one of the two buttons every day. Paul's schedule is at <a href="paul.html">paul.html</a>.</p>
</div>

<script src="questions.js"></script>
<script>
(function(){
  const dayMs = 86400000;
  function todayDay(){
    const start = new Date(START_DATE + "T00:00:00");
    const now = new Date(); now.setHours(0,0,0,0);
    const n = Math.floor((now - start)/dayMs) + 1;
    return Math.min(QUESTIONS.length, Math.max(1, n));
  }
  const key = d => "kd:answer:" + d;
  const get = d => { try { return localStorage.getItem(key(d)) || ""; } catch(e){ return ""; } };
  const set = (d,v) => { try { localStorage.setItem(key(d), v); } catch(e){} };
  const answered = d => get(d).trim().length > 0;

  let day = todayDay();
  const el = id => document.getElementById(id);

  function dateFor(d){
    const t = new Date(new Date(START_DATE + "T00:00:00").getTime() + (d-1)*dayMs);
    return t.toLocaleDateString("en-IE",{weekday:"long", day:"numeric", month:"long"});
  }

  function render(){
    const item = QUESTIONS.find(x => x.d === day);
    el("sub").textContent = "Tanager and Pepper v Doyle, 2020/45CA. " + HEARING_NOTE + ".";
    el("theme").textContent = "Week " + item.week + ". " + WEEKS[item.week];
    el("drill").classList.toggle("hidden", !item.drill);
    el("q").textContent = item.q;
    el("focus").textContent = item.focus;
    el("ans").value = get(day);
    spokenWords = 0;
    stopSpeaking();
    if(listening && rec){ listening = false; try{ rec.stop(); }catch(e){} }
    el("mic").classList.remove("live");
    el("mic").textContent = "Press and speak your answer";

    const t = todayDay();
    el("count").textContent = day === t
      ? "Day " + day + " of " + QUESTIONS.length + ". " + dateFor(day) + ". " + (QUESTIONS.length-day) + " to go."
      : "Day " + day + " of " + QUESTIONS.length + ". " + dateFor(day) + ". You are looking back from day " + t + ".";

    const track = el("track"); track.innerHTML = "";
    QUESTIONS.forEach(x => {
      const b = document.createElement("button");
      b.className = "tick" + (x.d === day ? " now" : answered(x.d) ? " done" : "");
      b.title = "Day " + x.d;
      b.setAttribute("aria-label","Go to day " + x.d);
      b.disabled = x.d > todayDay();
      b.onclick = () => { if(x.d <= todayDay()){ day = x.d; hideCheck(); render(); } };
      track.appendChild(b);
    });

    const list = el("checkList"); list.innerHTML = "";
    item.covers.forEach(c => { const li = document.createElement("li"); li.textContent = c; list.appendChild(li); });

    el("prev").disabled = day === 1;
    el("next").disabled = day >= todayDay();
    el("saved").classList.add("hidden");
    updateWc();
  }

  function hideCheck(){ el("check").classList.add("hidden"); }

  function plain(){
    const item = QUESTIONS.find(x => x.d === day);
    return "Kieran Doyle, hearing prep, day " + day + " of " + QUESTIONS.length + ", " + dateFor(day) +
      "\n\nQuestion:\n" + item.q +
      "\n\nAnswer (" + (voiceOK ? (spokenWords > 0 ? "spoken" : "NOT SPOKEN") : "typed or keyboard-dictated") + "):\n" +
      (el("ans").value.trim() || "(no answer given)") + "\n";
  }

  const synth = window.speechSynthesis;
  let speaking = false;

  function stopSpeaking(){
    if(synth) try{ synth.cancel(); }catch(e){}
    speaking = false;
    el("listen").classList.remove("live");
    el("listen").textContent = "Read the question to me";
  }

  el("listen").onclick = () => {
    if(!synth){
      el("saved").textContent = "This browser cannot read the question aloud.";
      el("saved").classList.remove("hidden");
      return;
    }
    if(speaking){ stopSpeaking(); return; }
    if(listening){
      el("saved").textContent = "Stop the microphone first, then press this.";
      el("saved").classList.remove("hidden");
      return;
    }
    const item = QUESTIONS.find(x => x.d === day);
    const u = new SpeechSynthesisUtterance(item.q + " " + item.focus);
    u.lang = "en-IE";
    u.rate = 0.92;
    u.onend = stopSpeaking;
    u.onerror = stopSpeaking;
    speaking = true;
    el("listen").classList.add("live");
    el("listen").textContent = "Stop reading";
    synth.speak(u);
  };

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const voiceOK = !!SR;
  let rec = null, listening = false, spokenWords = 0;

  el("ans").readOnly = voiceOK;
  el("ans").placeholder = voiceOK
    ? "Press the button above and speak. Your words appear here."
    : "Use the microphone key on your keyboard and speak your answer.";
  el("mode").textContent = voiceOK
    ? "Spoken answers only on this device. Say it the way you would say it standing up."
    : "This browser cannot capture speech directly. Use the microphone key on your keyboard rather than typing.";

  ["paste","drop"].forEach(ev =>
    el("ans").addEventListener(ev, e => {
      e.preventDefault();
      el("saved").textContent = "Pasting is off. Say the answer in your own words.";
      el("saved").classList.remove("hidden");
    }));

  function startRec(){
    if(!voiceOK) return;
    rec = new SR();
    rec.lang = "en-IE"; rec.continuous = true; rec.interimResults = false;
    rec.onresult = e => {
      let t = "";
      for(let i = e.resultIndex; i < e.results.length; i++)
        if(e.results[i].isFinal) t += e.results[i][0].transcript + " ";
      if(t){
        el("ans").value = (el("ans").value + " " + t).trim();
        spokenWords = el("ans").value.trim().split(/\s+/).filter(Boolean).length;
        set(day, el("ans").value); updateWc();
      }
    };
    rec.onend = () => { if(listening){ try{ rec.start(); }catch(e){} } };
    rec.onerror = ev => {
      listening = false; el("mic").classList.remove("live");
      el("mic").textContent = "Press and speak your answer";
      el("saved").textContent = ev.error === "not-allowed"
        ? "The microphone is blocked. Allow microphone access for this page and try again."
        : "The microphone stopped. Press the button again.";
      el("saved").classList.remove("hidden");
    };
    try{ rec.start(); }catch(e){}
  }

  el("mic").onclick = () => {
    if(!voiceOK){
      el("saved").textContent = "Use the microphone key on your keyboard instead.";
      el("saved").classList.remove("hidden"); return;
    }
    if(listening){
      listening = false; el("mic").classList.remove("live");
      el("mic").textContent = "Press and speak your answer";
      if(rec) try{ rec.stop(); }catch(e){}
    } else {
      stopSpeaking();
      listening = true; el("mic").classList.add("live");
      el("mic").textContent = "Listening. Press again to stop.";
      el("saved").classList.add("hidden");
      startRec();
    }
  };

  const words = () => el("ans").value.trim().split(/\s+/).filter(Boolean).length;
  const MIN = 40;
  let armed = false;

  function updateWc(){
    const n = words();
    const w = el("wc");
    w.textContent = n === 0 ? "" : n + (n === 1 ? " word" : " words") +
      (n < MIN ? ". Aim for " + MIN + " or more. Say it the way you would say it standing up." : "");
    w.className = "wc" + (n > 0 && n < MIN ? " warn" : "");
  }

  function echoed(){
    const a = el("ans").value.toLowerCase().replace(/\s+/g," ");
    const item = QUESTIONS.find(x => x.d === day);
    return item.covers.some(c => {
      const t = c.toLowerCase().replace(/\s+/g," ");
      return t.length > 30 && a.includes(t.slice(0, 45));
    });
  }

  el("ans").addEventListener("input", () => { set(day, el("ans").value); updateWc(); armed = false; });

  el("send").onclick = () => {
    set(day, el("ans").value);
    if(words() < MIN && !armed){
      armed = true;
      el("saved").textContent = "That is short. Try saying it out loud first, then write what you said. Press again to send it as it is.";
      el("saved").classList.remove("hidden");
      return;
    }
    const subj = "Kieran day " + day + " of " + QUESTIONS.length + " — " + dateFor(day);
    window.location.href = "mailto:" + PAUL_EMAIL +
      "?subject=" + encodeURIComponent(subj) +
      "&body=" + encodeURIComponent(plain());
    el("saved").textContent = echoed()
      ? "Sent. Note: some of that came back word for word from the answer points. Those are for checking yourself afterwards, not for copying. Put it in your own words next time."
      : "Saved. Your email should have opened. If it did not, use Copy for Paul instead.";
    armed = false;
    el("saved").classList.remove("hidden");
    el("check").classList.remove("hidden");
    render();
    el("check").classList.remove("hidden");
  };

  el("copy").onclick = async () => {
    set(day, el("ans").value);
    try { await navigator.clipboard.writeText(plain()); el("saved").textContent = "Copied. Paste it to Paul on WhatsApp."; }
    catch(e){ el("saved").textContent = "Copy did not work on this browser. Select the text and copy it by hand."; }
    el("saved").classList.remove("hidden");
    el("check").classList.remove("hidden");
  };

  el("prev").onclick = () => { if(day>1){ day--; hideCheck(); render(); } };
  el("next").onclick = () => { if(day < todayDay()){ day++; hideCheck(); render(); } };

  render();
})();
</script>
</body>
</html>
