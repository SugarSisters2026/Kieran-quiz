<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kieran — Hearing Prep</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f4f0;min-height:100vh;padding:16px}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
h1{font-size:20px;font-weight:600;color:#1a1a1a}
.sub{font-size:13px;color:#888;margin-top:3px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;margin-bottom:10px}
.badge-read{background:#e8f0fe;color:#1a56db}
.badge-action{background:#e1f5ee;color:#085041}
.badge-call{background:#faeeda;color:#633806}
.badge-prep{background:#eeedfe;color:#3c3489}
.badge-rest{background:#f1efe8;color:#444}
.week-label{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.question{font-size:16px;font-weight:500;color:#1a1a1a;line-height:1.5;margin-bottom:10px}
.hint{font-size:13px;color:#555;background:#f9f9f7;border-left:3px solid #ddd;padding:8px 12px;border-radius:0 8px 8px 0;margin-bottom:14px;line-height:1.5}
textarea{width:100%;border:1.5px solid #e0e0e0;border-radius:10px;padding:12px;font-size:15px;font-family:inherit;resize:vertical;min-height:110px;outline:none;transition:border-color .2s}
textarea:focus{border-color:#1a56db}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:10px;transition:background .2s}
.btn-primary{background:#1a56db;color:#fff}
.btn-primary:hover{background:#1648c0}
.btn-primary:disabled{background:#aaa;cursor:default}
.btn-sec{background:#f0f0ec;color:#444}
.btn-sec:hover{background:#e4e4e0}
.feedback{padding:14px;border-radius:10px;margin-top:12px;font-size:14px;line-height:1.6;display:none}
.feedback.good{background:#e6f9f0;border:1px solid #6ee7b7;color:#065f46}
.feedback.weak{background:#fff3cd;border:1px solid #fcd34d;color:#78350f}
.feedback.loading{background:#f0f0f0;color:#555;font-style:italic}
.fb-label{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.progress-wrap{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0}
.pip{width:9px;height:9px;border-radius:50%;background:#e0e0e0;cursor:pointer}
.pip.done{background:#22c55e}
.pip.active{background:#1a56db;transform:scale(1.3)}
.pip.rest{background:#f3a700}
.pip.call{background:#f97316}
.nav{display:flex;gap:8px;margin-top:10px;display:none}
.nav .btn{margin-top:0}
.sent{background:#dcfce7;border:1px solid #86efac;color:#166534;padding:12px;border-radius:10px;font-size:14px;font-weight:500;margin-top:10px;display:none;text-align:center}
.done-banner{background:#f0fdf4;border:2px solid #86efac;color:#166534;padding:20px;border-radius:12px;text-align:center;font-size:15px;font-weight:500;display:none}
.paul-link{text-align:center;margin-top:8px}
.paul-link a{font-size:13px;color:#1a56db;text-decoration:none}
.day-num{font-size:13px;color:#888;margin-bottom:8px}
</style>
</head>
<body>

<div class="card">
  <h1>⚖️ Kieran — Hearing Prep</h1>
  <p class="sub">Tanager v Doyle 2020/45CA · Hearing: 13 October 2026</p>
  <div class="progress-wrap" id="progress"></div>
  <div class="day-num" id="day-num">Day 1 of 42</div>
  <div class="paul-link"><a href="paul.html">Paul's dashboard →</a></div>
</div>

<div class="card" id="quiz-card">
  <div class="week-label" id="week-label"></div>
  <div class="badge" id="type-badge"></div>
  <div class="question" id="question"></div>
  <div class="hint" id="hint"></div>
  <textarea id="answer" placeholder="Type your answer here..."></textarea>
  <button class="btn btn-primary" id="submit-btn" onclick="submit()">Submit answer</button>
  <div class="feedback" id="feedback">
    <div class="fb-label">Claude's assessment</div>
    <div id="fb-text"></div>
  </div>
  <div class="sent" id="sent">✅ Paul has been notified of your result.</div>
  <div class="nav" id="nav">
    <button class="btn btn-sec" onclick="go(-1)">← Back</button>
    <button class="btn btn-primary" onclick="go(1)">Next day →</button>
  </div>
</div>

<div class="done-banner" id="done-banner">
  🎉 All 42 days complete!<br><br>
  The hearing is <strong>13 October 2026</strong>.<br>
  You are ready, Kieran. Good luck.
</div>

<script>
const STORAGE_KEY = 'kieran_v2';
const PAUL_KEY = 'paul_results';

const SCHEDULE = [
  {d:1,w:"Week 1 — Foundations",t:"read",q:"Explain the core holding of Fannon v Ulster Bank [2024] IECA 51. What does charge registration on the Land Registry folio NOT prove? What must an assignee prove separately?",h:"Focus: registration proves the charge exists but NOT that the debt was absolutely assigned. Tanager registered on the folio but that does not prove it had the right to sue."},
  {d:2,w:"Week 1 — Foundations",t:"read",q:"What are the four conditions for an absolute assignment under section 28(6) of the Supreme Court of Judicature Act (Ireland) 1877, as set out in O'Rourke v Considine [2011] IEHC 191? What happens to the assignor once an absolute assignment is complete?",h:"Four conditions: in writing, unconditional, absolute, notice to debtor. Once all four are met the assignor loses the right to sue — only the assignee can enforce."},
  {d:3,w:"Week 1 — Foundations",t:"call",q:"CALL NIGHT. Before Paul calls: write out how Fannon and O'Rourke both apply to the Doyle case. Why could Tanager not have had the right to sue when it issued the Civil Bill in July 2015?",h:"C1 Charge 14 April 2014 — Tanager assigned absolutely to Deutsche Trustee. Civil Bill 22 July 2015 — 15 months later. Tanager had already given away the right to sue."},
  {d:4,w:"Week 1 — Foundations",t:"read",q:"What happened in Woodruffe [2026] IEHC 369 (Cahill J) and why was the case remitted to plenary? How does the Global Deed's CRO discrepancy (649497 vs 34927) apply?",h:"Plaintiff's own documents contradicted their title. Cahill J remitted to plenary. In Doyle: the Global Deed says CRO 649497 (IRMT-BW1 DAC) not 34927 (Pepper). Pepper's own deed does not correctly identify Pepper."},
  {d:5,w:"Week 1 — Foundations",t:"read",q:"What did Baker J hold in AIB Mortgage Bank v Thompson [2017] IEHC 515 about valid notice of assignment under section 28(6)? Why does the Tanager Notice of Assignment of 26 March 2021 fail this test?",h:"A general demand letter or account statement is not enough. The notice must specifically identify the assignment, the assignee, and what was assigned. Tanager's letter does not exhibit any assignment documents."},
  {d:6,w:"Week 1 — Foundations",t:"action",q:"Write out the full transaction chain from memory — every party, every date, every defect. BOSI → BOS → Tanager → Deutsche Trustee → Balbec/Lagado → Pepper. No notes.",h:"Merger: 31 Dec 2010. C1 absolute assignment: 14 Apr 2014. Civil Bill: 22 Jul 2015. Possession order: 27 Jan 2020. Balbec transfer: 18 Dec 2020. Global Deed: 25 Mar 2021. Pepper joined: 7 Feb 2022."},
  {d:7,w:"Week 1 — Foundations",t:"rest",q:"Rest day — but tell me in one paragraph: why does this case matter to you personally and why will you win?",h:"This is your family home. Eleven years of fighting. You now have the arguments. Say it like you mean it."},
  {d:8,w:"Week 2 — Title Chain & Standing",t:"read",q:"Read Recital B of the Global Deed of Transfer (25 March 2021) and Clause 1. What does Recital B say about who holds beneficial ownership? What does 'to the extent capable of assignment' mean?",h:"Recital B: 'The Buyer nominated the Transferee to acquire the legal title.' Buyer = Balbec/Lagado. Pepper = legal title only. 'To the extent capable of assignment' = conditional, fails Waldron condition 2."},
  {d:9,w:"Week 2 — Title Chain & Standing",t:"read",q:"Explain section 28(2) of the Central Bank Act 1997 (as amended) in your own words. Why does it matter for the Balbec/Lagado argument?",h:"Section 28(2): a person on whose behalf legal title is held is TAKEN to be credit servicing even if an authorised firm administers day to day. Balbec nominated Pepper. Balbec is therefore taken to be credit servicing."},
  {d:10,w:"Week 2 — Title Chain & Standing",t:"call",q:"CALL NIGHT. Why is Cave Projects v Gilhooley [2025] IESC 3 distinguishable from the Doyle case on THREE grounds? What is the Birkett test?",h:"Ground 1: not pleaded in Cave Projects — Doyle has it pleaded in HC plenary. Ground 2: retrospectivity — Doyle transfer was March 2021, two years after 2018 Act. Ground 3: uncertainty about definition — Doyle structure is clearer. Birkett: persuasive and comprehensive evidence of illegality."},
  {d:11,w:"Week 2 — Title Chain & Standing",t:"read",q:"What do the two Central Bank letters (27 and 28 August 2026) say about Lagado Assets IE IV? Quote the key sentence from the 28 August letter word for word.",h:"Key sentence: 'SPV registration should not be taken as confirmation that Lagado Assets IE IV is an authorised credit servicing firm or otherwise regulated by the Central Bank.'"},
  {d:12,w:"Week 2 — Title Chain & Standing",t:"prep",q:"Write the standing opening from memory word for word. 'Before this Court proceeds...'",h:"Before this Court proceeds to hear evidence in the appeal, I respectfully ask this Court to determine as a threshold matter whether the Second Named Plaintiff, Pepper Finance Corporation (Ireland) Designated Activity Company, has standing to seek possession in this appeal. This is a jurisdictional matter. Standing cannot be waived by procedural inaction. This Court cannot grant possession to a party that has no title. I ask this Court to hear submissions on standing before evidence is called."},
  {d:13,w:"Week 2 — Title Chain & Standing",t:"action",q:"Have you checked CRO 677355 (Balbec Loan IE IV Limited / Lagado Assets IE IV) on cro.ie? What does the register show? What is the date of the name change?",h:"Go to cro.ie, search 677355. Confirm the company is now named Lagado Assets IE IV. Screenshot the result. Email to paulcoyle1903@gmail.com — this is exhibit evidence."},
  {d:14,w:"Week 2 — Title Chain & Standing",t:"rest",q:"Rest day. What are the THREE specific defects in Pepper's title? Name each one precisely.",h:"1: CRO number discrepancy (649497 vs 34927) in the Global Deed. 2: Negative Pledge breach — no Deutsche Trustee consent to the 2021 transfer. 3: Lagado/Balbec not authorised under Part V of the Central Bank Act 1997 as amended."},
  {d:15,w:"Week 3 — Unfair Terms",t:"read",q:"Your submissions identify four unfair terms. Name each one by clause number and explain in one sentence why it is unfair.",h:"Clause 3.3: variable rate with no objective criteria. Clause 5.2(d): arrears interest at full mortgage rate — Stack J said may be unlawful. Clause 7.4: conclusive evidence — bank statements final. Clause 8.1: transferee can vary interest rate."},
  {d:16,w:"Week 3 — Unfair Terms",t:"read",q:"Why is the APR asterisk on the loan offer (item 7: APR* — 3.82%) significant for the unfair terms argument?",h:"The asterisk footnote defines the ECB Rate. Consumer led to believe rate was ECB-linked. But Clause 3.3 has NO ECB reference — rate is BOSI standard variable at their own discretion. The two documents contradict each other from the consumer's perspective."},
  {d:17,w:"Week 3 — Unfair Terms",t:"call",q:"CALL NIGHT. What is the own-motion obligation? Which Irish case confirmed it as public policy at paragraph 122? Why is Cannon distinguishable from the Doyle case?",h:"Coleman [2025] IEHC 747 (Stack J) and Cannon [2020] IESC 2 para 122 (O'Malley J). Cannon: rate moved in borrowers' favour. Doyle: rate moved adversely AND Clause 3.3 has zero objective criteria. Cannon also predates Kasler, GR REAL, C-744/24."},
  {d:18,w:"Week 3 — Unfair Terms",t:"read",q:"What did Stack J hold in Coleman [2025] IEHC 747? What did Barrett J hold in Kenehan [2017] IEHC 604 and how does it apply to the missing February 2008 T&Cs?",h:"Coleman: own-motion duty applies at enforcement stage even after judgment. Kenehan: possession REFUSED because lender failed to place all contractual documentation before the court. February 2008 T&Cs have never been produced — court cannot discharge its obligation without them."},
  {d:19,w:"Week 3 — Unfair Terms",t:"read",q:"What does paragraph 65 of Pepper Finance v Cuffe [2025] IEHC 393 (Phelan J) say? State the test. Why does it apply to the Doyle case?",h:"Test: parallel High Court proceedings 'reasonably offering a chance' of a substantive remedy affecting the possession claim. HC plenary 2026/1350P before Stack J directly challenges Pepper's title. It is reasonably offering a chance of rectification of Folio DN3781F."},
  {d:20,w:"Week 3 — Unfair Terms",t:"prep",q:"Write the adjournment argument in your own words. Three reasons. One minute. Say it out loud after writing it.",h:"1: Standing challenge already in HC plenary 2026/1350P — Cuffe para 65. 2: Lagado/Balbec unregulated — Pepper's title in issue. 3: HC plenary reasonably offering a chance of rectification of DN3781F."},
  {d:21,w:"Week 3 — Unfair Terms",t:"rest",q:"Rest day. Name every case from this week and what each one holds.",h:"Coleman, Cannon, Kenehan, Cuffe, Kasler C-26/13, Andriciuc C-186/16, C-744/24, GR REAL C-351/23, Banco Primus C-421/14, Calderon Camino C-618/10."},
  {d:22,w:"Week 4 — Practise & Documents",t:"action",q:"List every document in your hearing bundle and which tab it is in — from memory. Ten tabs.",h:"Tab 1: submissions. Tab 2: C1 Apr 2014. Tab 3: C1 Oct 2014. Tab 4: Global Deed. Tab 5: Central Bank letters. Tab 6: loan offer. Tab 7: T&Cs. Tab 8: NTP. Tab 9: NTA. Tab 10: CRO screenshot."},
  {d:23,w:"Week 4 — Practise & Documents",t:"prep",q:"Write all three opening submissions from memory — STANDING, ADJOURNMENT, UNFAIR TERMS — under 90 seconds each. No notes. Paul times you tonight.",h:"Standing: jurisdictional threshold, Cahill v Sutton, cannot be waived. Adjournment: Cuffe para 65, HC plenary 2026/1350P. Unfair terms: Clause 3.3, own-motion, Coleman."},
  {d:24,w:"Week 4 — Practise & Documents",t:"call",q:"MOCK HEARING. Answer these judge questions: (1) Why didn't you raise this in the Circuit Court? (2) You've been paying Pepper for years — doesn't that mean you accept their standing? (3) Why should I adjourn a case running since 2015?",h:"(1) Mr Lyons gravely ill — affidavit available — supervening facts postdate the order. (2) Payments to servicer on their representations — Donahoe confirms no waiver. (3) Cuffe para 65 — HC plenary directly challenges Pepper's title."},
  {d:25,w:"Week 4 — Practise & Documents",t:"action",q:"Have OSM Partners responded to the Notice to Produce? If not, what must happen next and by when?",h:"If no response: follow-up letter immediately. If documents not produced by 1 October: Rule 5 motion. Must be served 4 clear days before hearing. If hearing is 13 October: motion by 8 October at latest. Report to Paul today."},
  {d:26,w:"Week 4 — Practise & Documents",t:"read",q:"What are the key arguments in Brendan Donlon BL's V5 submissions? How do Brendan's arguments differ from yours? What is the rule about who speaks first?",h:"Brendan: absolute assignment, Wolfhound C1, purchase deed not before court, hearsay statements. Kieran: standing (Lagado), adjournment (Cuffe), unfair terms. Brendan opens first. Kieran's arguments are in ADDITION — they must not repeat or contradict."},
  {d:27,w:"Week 4 — Practise & Documents",t:"prep",q:"Write your one-page cheat sheet. Three sections: STANDING, ADJOURNMENT, UNFAIR TERMS. Case names and paragraph numbers only. No full sentences.",h:"Standing: Cahill v Sutton [1980], Goold v Collins [2004], Cave Projects paras 6 15 32 33. Adjournment: Cuffe [2025] IEHC 393 para 65. Unfair terms: Coleman [2025], Cannon para 122, Kenehan [2017]."},
  {d:28,w:"Week 4 — Practise & Documents",t:"rest",q:"Rest day. Tell Paul one thing you are confident about and one thing you are still unsure about. Be honest.",h:"Paul needs to know what to fix in Week 5. Do not pretend everything is fine if it is not."},
  {d:29,w:"Week 5 — Refinement",t:"read",q:"What happened in EBS v Kenehan [2017] IEHC 604? Why is it directly relevant to the February 2008 BOSI T&Cs never being produced in the Doyle proceedings?",h:"Barrett J refused possession because the lender failed to place all contractual documentation before the court. Without the T&Cs the court cannot assess Clause 3.3. The own-motion obligation cannot be discharged without the T&Cs."},
  {d:30,w:"Week 5 — Refinement",t:"read",q:"What does Cahill v Sutton [1980] IR 269 (Henchy J) say about locus standi? Why does this mean Kieran does NOT need a prior notice of motion to raise the standing point at the de novo hearing?",h:"Locus standi is jurisdictional. Cannot be waived by procedural inaction. A court cannot grant relief to a party that has no standing regardless of when the objection is raised. Jurisdiction is different from a Lough Swilly procedural objection."},
  {d:31,w:"Week 5 — Refinement",t:"call",q:"ALL CASES QUIZ. For each: court, judge, year, one-line holding, how it applies to Doyle. Cases: Fannon, O'Rourke, Thompson, Woodruffe, Cave Projects, Cahill v Sutton, Goold v Collins, Lough Swilly, Coleman, Cannon, Kenehan, Cuffe, O'Reilly [2026] IEHC 16.",h:"No notes. No hesitation. Paul will go in random order. Know every single one."},
  {d:32,w:"Week 5 — Refinement",t:"action",q:"URGENT — If the hearing is 13 October, today is the last day to issue a Rule 5 motion to compel inspection if OSM has still not produced documents. Have they produced? Tell Paul immediately.",h:"Order 32 Rule 5 Circuit Court Rules: motion grounded on affidavit showing documents sought and in Respondents' possession. Must be served at least 4 clear days before hearing. Do not wait."},
  {d:33,w:"Week 5 — Refinement",t:"prep",q:"Write the payments answer from memory: the judge says 'You've been making payments to Pepper for years — doesn't that mean you accept their standing?'",h:"Payments were made to Pepper as servicer on foot of their own representations. The Doyles were not in a position to investigate the legal structure. Pepper cannot rely on a waiver induced by their own representations. PTSB v Donahoe [2025] IECA 222 confirms prior dealings do not preclude a standing challenge."},
  {d:34,w:"Week 5 — Refinement",t:"prep",q:"Write the Mr Lyons answer from memory: the judge asks why the standing point was not raised in the Circuit Court.",h:"Mr Lyons was gravely ill on the day of the Circuit Court hearing. He subsequently passed away. An affidavit from his firm is available. Furthermore, the Lagado/Balbec transfer, the CRO discrepancy, and the Central Bank correspondence all postdate the Circuit Court order — they could not have been raised before Judge Linnane."},
  {d:35,w:"Week 5 — Refinement",t:"rest",q:"Rest day. How are you feeling? What is the one thing you most need to practise in the final week? Be honest with Paul.",h:"There is still time to fix anything. Do not pretend you are ready if you are not."},
  {d:36,w:"Week 6 — Final Prep",t:"action",q:"Is the physical hearing bundle assembled? Two tabbed copies? List all ten tabs from memory.",h:"Tab 1: submissions. Tab 2: C1 Apr 2014. Tab 3: C1 Oct 2014. Tab 4: Global Deed. Tab 5: CB letters. Tab 6: loan offer. Tab 7: T&Cs. Tab 8: NTP. Tab 9: NTA. Tab 10: CRO screenshot. Report to Paul when done."},
  {d:37,w:"Week 6 — Final Prep",t:"call",q:"FINAL MOCK HEARING. Write all three arguments from memory — STANDING, ADJOURNMENT, UNFAIR TERMS — under 7 minutes total. Then Paul calls.",h:"This is the last full run-through. No excuses. No notes. You know this case."},
  {d:38,w:"Week 6 — Final Prep",t:"action",q:"Have you confirmed with Brendan that both sets of submissions are on the record? Have you asked whether to open with standing or adjournment first?",h:"Contact Brendan today: (1) Kieran's submissions served, (2) Brendan's V5 served, (3) hearing date confirmed, (4) Brendan's view on which argument to open with."},
  {d:39,w:"Week 6 — Final Prep",t:"prep",q:"State the four rules for courtroom presence. Then say them again.",h:"1: Address the judge as 'Judge' — not Your Honour. 2: Always STAND when speaking. 3: Speak SLOWER than feels natural. 4: Look at the judge. Do NOT read from your submissions."},
  {d:40,w:"Week 6 — Final Prep",t:"prep",q:"Light review only. Say the three opening arguments one last time. Under 5 minutes total. No notes.",h:"Standing → Adjournment → Unfair terms. You know these. The preparation is done."},
  {d:41,w:"Week 6 — Final Prep",t:"action",q:"Check courts.ie — Cause Lists — High Court — Monday 13 October 2026. Find case 2020/45CA. What court number, what position, what time? Arrive 30 minutes early.",h:"courts.ie → Cause Lists → High Court. Note the courtroom, position, time. Tell Paul the details today."},
  {d:42,w:"Week 6 — Final Prep",t:"rest",q:"Tomorrow is the hearing. Write down in your own words what you want to achieve and why you deserve to win.",h:"This is your family home. You and Liz have been fighting for eleven years through serious illness, the death of your solicitor, and every obstacle. Tomorrow you put it before the court. Paul calls tonight at 7pm — confidence check only."}
];

function getState(){
  try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{day:1,results:[]};}catch(e){return{day:1,results:[]};}
}
function saveState(s){localStorage.setItem(STORAGE_KEY,JSON.stringify(s));}
function getResults(){
  try{return JSON.parse(localStorage.getItem(PAUL_KEY))||[];}catch(e){return[];}
}
function saveResult(r){
  const rs=getResults();rs.push(r);
  localStorage.setItem(PAUL_KEY,JSON.stringify(rs.slice(-42)));
}

const BADGE={read:'Read',action:'Action',call:'Call Night',prep:'Practise',rest:'Rest'};
const BADGE_CLASS={read:'badge-read',action:'badge-action',call:'badge-call',prep:'badge-prep',rest:'badge-rest'};

let state=getState();

function renderProgress(){
  const p=document.getElementById('progress');
  p.innerHTML='';
  for(let i=0;i<42;i++){
    const d=document.createElement('div');
    d.className='pip';
    const item=SCHEDULE[i];
    if(i+1<state.day) d.classList.add('done');
    else if(i+1===state.day) d.classList.add('active');
    else if(item.t==='rest') d.classList.add('rest');
    else if(item.t==='call') d.classList.add('call');
    d.title=`Day ${i+1}`;
    d.onclick=()=>{state.day=i+1;saveState(state);renderDay();}
    p.appendChild(d);
  }
}

function renderDay(){
  renderProgress();
  const s=state;
  if(s.day>42){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('done-banner').style.display='block';
    document.getElementById('day-num').textContent='All 42 days complete!';
    return;
  }
  const item=SCHEDULE[s.day-1];
  document.getElementById('day-num').textContent=`Day ${s.day} of 42`;
  document.getElementById('week-label').textContent=item.w;
  const badge=document.getElementById('type-badge');
  badge.textContent=BADGE[item.t]||item.t;
  badge.className='badge '+BADGE_CLASS[item.t];
  document.getElementById('question').textContent=item.q;
  document.getElementById('hint').textContent='💡 '+item.h;
  document.getElementById('answer').value='';
  document.getElementById('feedback').style.display='none';
  document.getElementById('sent').style.display='none';
  document.getElementById('nav').style.display='none';
  const btn=document.getElementById('submit-btn');
  btn.disabled=false;
  btn.textContent='Submit answer';
}

async function submit(){
  const answer=document.getElementById('answer').value.trim();
  if(!answer){alert('Please type your answer first.');return;}
  const btn=document.getElementById('submit-btn');
  btn.disabled=true;btn.textContent='Assessing...';
  const fb=document.getElementById('feedback');
  const fbText=document.getElementById('fb-text');
  fb.className='feedback loading';fb.style.display='block';
  fbText.textContent='Claude is reading your answer...';
  const item=SCHEDULE[state.day-1];
  const sys=`You are assessing Kieran Doyle's answers to legal quiz questions in preparation for a de novo High Court hearing (Tanager DAC and Pepper Finance Corporation (Ireland) DAC v Kieran Doyle and Elizabeth Doyle, Record No. 2020/45CA, October 2026). Be honest and direct. 3-5 sentences. End with STRONG or NEEDS WORK.`;
  const msg=`Day ${item.d} — ${item.w}\nQuestion: ${item.q}\nKey concepts: ${item.h}\nKieran's answer: "${answer}"\nAssess this answer.`;
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,system:sys,messages:[{role:'user',content:msg}]})
    });
    const data=await resp.json();
    const assessment=data.content?.[0]?.text||'Could not get assessment.';
    const isStrong=assessment.includes('STRONG');
    fb.className='feedback '+(isStrong?'good':'weak');
    fbText.textContent=assessment;
    const result={day:item.d,week:item.w,question:item.q,answer,assessment,strong:isStrong,time:new Date().toISOString()};
    saveResult(result);
    if(isStrong){state.day=Math.max(state.day,state.day+1);saveState(state);}
    document.getElementById('sent').style.display='block';
    document.getElementById('nav').style.display='flex';
    btn.textContent='Submitted';
  }catch(e){
    fb.className='feedback weak';fb.style.display='block';
    fbText.textContent='Connection error. Check internet and try again.';
    btn.disabled=false;btn.textContent='Submit answer';
  }
}

function go(dir){
  state.day=Math.max(1,Math.min(42,state.day+dir));
  saveState(state);renderDay();
}

renderDay();
</script>
</body>
</html>
